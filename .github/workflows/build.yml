name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; jobs that publish ask for more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go vet ./... && go test ./...
      - run: cd web && npm ci && npm run build
      - name: Cross-compile agent
        run: make agent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vibemdm-agent
          path: bin/agents/

  # Accessibility: starts the server on a throwaway database, fills it with simulated Macs and
  # iPhones, and runs axe-core on every console page in light and dark theme. A problem that is
  # not in tests/a11y/baseline.json fails the build. See docs/ui-guidelines.md (Accessibility).
  a11y:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vibemdm
          POSTGRES_PASSWORD: vibemdm
          POSTGRES_DB: vibemdm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibemdm -d vibemdm"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/a11y/package-lock.json
      - name: Build the console, server and simulator
        run: make web build sim
      - name: Install the browser
        working-directory: tests/a11y
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Start a throwaway server
        run: |
          mkdir -p "$RUNNER_TEMP/a11y/data"
          cd "$RUNNER_TEMP/a11y"
          openssl rand -base64 24 | tr -d '\n=+/' > admin-password
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout push.key -out push.pem \
            -subj "/UID=com.apple.mgmt.External.ci/CN=APSP:ci" 2>/dev/null
          VIBEMDM_DATABASE_URL='postgres://vibemdm:vibemdm@127.0.0.1:5432/vibemdm?sslmode=disable' \
          VIBEMDM_SERVER_URL=http://127.0.0.1:8080 VIBEMDM_LISTEN=127.0.0.1:8080 \
          VIBEMDM_DATA_DIR="$RUNNER_TEMP/a11y/data" VIBEMDM_AGENT_DIR="$GITHUB_WORKSPACE/bin/agents" \
          VIBEMDM_ADMIN_PASSWORD="$(cat admin-password)" VIBEMDM_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            nohup "$GITHUB_WORKSPACE/bin/vibemdm" > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz >/dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Accessibility scan
        working-directory: tests/a11y
        env:
          VIBEMDM_SIM: ${{ github.workspace }}/bin/vibemdm-sim
          A11Y_PUSH_CERT: ${{ runner.temp }}/a11y/push.pem
          A11Y_PUSH_KEY: ${{ runner.temp }}/a11y/push.key
        run: node scan.mjs --base http://127.0.0.1:8080 --admin-password-file "$RUNNER_TEMP/a11y/admin-password" --seed
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a11y-report
          path: tests/a11y/a11y-report.json
          if-no-files-found: ignore

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vibemdm-agent
          path: agents
      - name: Checksums
        run: cd agents && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: agents/*
          # A version with a suffix (v0.1.0-beta.1, -rc.1) is published as a pre-release, so GitHub
          # does not label it "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
