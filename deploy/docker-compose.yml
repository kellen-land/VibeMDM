# VibeMDM — self-hosted Apple MDM
#
#   cp .env.example .env   # edit values
#   docker compose up -d
#
# Add the "tls" profile to run Caddy with automatic Let's Encrypt certificates:
#   docker compose --profile tls up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibemdm
      POSTGRES_USER: vibemdm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibemdm -d vibemdm"]
      interval: 5s
      timeout: 5s
      retries: 20

  vibemdm:
    image: ${VIBEMDM_IMAGE:-vibemdm/vibemdm:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VIBEMDM_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      VIBEMDM_DATABASE_URL: postgres://vibemdm:${POSTGRES_PASSWORD}@db:5432/vibemdm?sslmode=disable
      VIBEMDM_SERVER_URL: ${VIBEMDM_SERVER_URL:?set VIBEMDM_SERVER_URL in .env (https://mdm.example.com)}
      VIBEMDM_ADMIN_PASSWORD: ${VIBEMDM_ADMIN_PASSWORD:-}
      VIBEMDM_ENCRYPTION_KEY: ${VIBEMDM_ENCRYPTION_KEY:-}
      VIBEMDM_DEBUG: ${VIBEMDM_DEBUG:-false}
      VIBEMDM_LOG_FORMAT: ${VIBEMDM_LOG_FORMAT:-text}
    volumes:
      - vibemdm-data:/data
    ports:
      - "${VIBEMDM_PORT:-8080}:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - vibemdm
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env for the tls profile}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  vibemdm-data:
  caddy-data:
  caddy-config:
